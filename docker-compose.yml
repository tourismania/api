services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: tourismania-api:latest
    container_name: tourismania_app
    depends_on:
      database:
        condition: service_healthy
      kafka:
        condition: service_started
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  database:
    image: postgres:17-alpine
    container_name: tourismania_database
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-tourismania}
      POSTGRES_USER: ${DATABASE_USER:-root}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-qwerty123}
    volumes:
      - pgdata:/var/lib/postgres/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-root} -d ${DATABASE_NAME:-tourismania}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Kafka (KRaft mode) ───────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:3.7.2
    container_name: tourismania_kafka
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      # Фиксированный id KRaft-кластера: с персистентным volume случайный id
      # при каждом старте конфликтовал бы с уже отформатированным хранилищем.
      CLUSTER_ID: "UBhmvaKgCRxR6BT8tczEjw"
      # Single-node: у системных топиков нет реплик, фактор снижен до 1
      # (дефолты официального образа рассчитаны на кластер из 3+ брокеров).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  pgdata: {}
  # kafka_data (не kafka): данные bitnami-образа в старом volume несовместимы
  # с раскладкой apache/kafka; старый volume можно удалить: docker volume rm <project>_kafka
  kafka_data: {}
