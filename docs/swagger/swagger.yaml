      - Bearer: []
      summary: List currencies
      tags:
      - Currencies
  /api/v1/offers:
    get:
      description: Paginated offer listing (any status) scoped to the caller's own
        agency. Role has no effect on visibility, only on write access.
      parameters:
      - description: Filter by status (draft|ready|published)
        in: query
        name: status
        type: string
      - description: Filter by author user id
        in: query
        name: created_by
        type: integer
      - description: Max results (1–100, default 20)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (0–10000)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/listoffershttp.ListOffersResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - Bearer: []
      summary: List offers
      tags:
      - Offers
    post:
      consumes:
      - application/json
      description: Publishes a new offer under the caller's own agency. Requires ROLE_AGENT
        or ROLE_SUPER_ADMIN. Optional "flights" key attaches one or more flights (each
        an ordered list of nonstop segments) atomically with offer creation.
      parameters:
      - description: Offer payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/createofferhttp.CreateOfferRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/createofferhttp.CreateOfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - Bearer: []
      summary: Create an offer
      tags:
      - Offers
  /api/v1/offers/{uuid}:
    delete:
      description: Soft-deletes an offer. Only an agent/super admin belonging to the
        offer's own agency may delete it — 1 user = 1 agency, no cross-agency access.
        An offer belonging to another agency is reported as not found.
      parameters:
      - description: Offer UUID
        in: path
        name: uuid
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - Bearer: []
      summary: Delete an offer
      tags:
      - Offers
    get:
      description: Returns a single offer by uuid, scoped to the caller's own agency
        (any status), including its flights with computed total/layover durations.
        An offer belonging to another agency is reported as not found.
      parameters:
      - description: Offer UUID
        in: path
        name: uuid
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/getofferhttp.OfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - Bearer: []
      summary: Get an offer
      tags:
      - Offers
    patch:
      consumes:
      - application/json
      description: 'Partially updates an offer. Only an agent/super admin belonging
        to the offer''s own agency may update it — 1 user = 1 agency, no cross-agency
        access. An offer belonging to another agency is reported as not found. "flights"
        follows the same optional-field convention: absent leaves flights untouched,
        present (including []) fully replaces them.'
      parameters:
      - description: Offer UUID
        in: path
        name: uuid
        required: true
        type: string
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/updateofferhttp.UpdateOfferRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/updateofferhttp.UpdateOfferResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      security:
      - Bearer: []
      summary: Update an offer
      tags:
      - Offers
  /api/v1/public/offers/{uuid}:
    get:
      description: Returns a single offer by uuid, no authentication required, including
        its flights with computed total/layover durations. Only published offers are
        visible — draft/ready offers of any agency are reported as not found.
      parameters:
