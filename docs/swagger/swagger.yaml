info:
  contact: {}
  description: REST API for user management with JWT auth and Kafka events.
  title: Tourismania API
  version: 1.0.2
paths:
  /api/login:
    post:
      consumes:
      - application/json
      description: Exchanges username/password for an RS256-signed JWT.
      parameters:
      - description: Credentials
        in: body
        name: message
        required: true
        schema:
          $ref: '#/definitions/loginhttp.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/loginhttp.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
      summary: Issue a JWT
      tags:
      - Auth
  /api/v1/airlines:
    get:
      description: 'Поиск авиакомпаний справочника по подстроке английского или русского
        названия либо названия страны (без учёта регистра и диакритики, символы сравниваются
        буквально), с отбором по стране и по списку id. По кодам ICAO/IATA не ищет.
        Возвращает только выбираемые для сегмента записи: дубли и пропавшие из источника
        не возвращаются (их отдаёт GET /api/v1/airlines/{id}). Действующие выше прекративших
        работу; внутри — начало названия, подстрока названия, только страна. id из
        выдачи — значение airline_id сегмента перелёта; «Неизвестная» — id 1.'
      parameters:
      - description: Строка поиска, от 3 символов после нормализации; обязательна
          без ids
        in: query
        name: search
        type: string
      - description: Код страны ISO 3166-1 alpha-2, без учёта регистра
        in: query
        name: country
        type: string
      - description: 'Id через запятую: от 1 до 100 целых ≥ 1, повторы не учитываются'
        in: query
        name: ids
        type: string
      - description: Размер страницы (1–100, по умолчанию 20)
        in: query
        name: limit
        type: integer
      - description: Сдвиг (0–10000, по умолчанию 0)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/searchairlinehttp.SearchResponse'
        "400":
          description: INVALID_SEARCH
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
      security:
      - Bearer: []
      summary: Search airlines
      tags:
      - Airlines
  /api/v1/airlines/{id}:
    get:
      description: Авиакомпания справочника по id, в том числе дубль или пропавшая
        из источника, которых поиск не возвращает, — чтобы показать авиакомпанию,
        на которую уже ссылается сохранённый сегмент. Нет записи или id не целое ≥
        1 — 404.
      parameters:
      - description: Id авиакомпании
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/getairlinehttp.GetResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorBody'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
      security:
      - Bearer: []
      summary: Get an airline
      tags:
      - Airlines
  /api/v1/airports:
    get:
      description: Full-text search over airports and cities with ranking and pagination.
      parameters:
      - description: Search string (min 2 chars)
        in: query
        name: search
        required: true
        type: string
      - description: Max results (1–100, default 20)
        in: query
        name: limit
        type: integer
      - description: Pagination offset (0–10000)
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/searchairporthttp.SearchResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/httpx.StructuredErrorBody'
      security:
      - Bearer: []
