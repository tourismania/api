definitions:
  airlinehttp.AirlineResponse:
    properties:
      country:
        allOf:
        - $ref: '#/definitions/airlinehttp.CountryResponse'
        description: Country — страна или null, если неизвестна.
      dissolved_on:
        description: DissolvedOn — дата прекращения деятельности YYYY-MM-DD; null
          — действует.
        example: "2015-10-26"
        type: string
      icao:
        description: ICAO — код ICAO; null только у служебной записи «Неизвестная»
          (id 1).
        example: AFL
        type: string
      id:
        example: 42
        type: integer
      name:
        description: Name — английское название.
        example: Aeroflot
        type: string
      name_ru:
        description: |-
          NameRU — русское название, только у авиакомпаний России; поле
          присутствует всегда, "" — русского названия нет.
        example: Аэрофлот
        type: string
    type: object
  airlinehttp.CountryResponse:
    properties:
      iso2:
        example: RU
        type: string
      name:
        example: Россия
        type: string
    type: object
  createofferhttp.CreateOfferRequest:
    properties:
      description:
        maxLength: 5000
        type: string
      flights:
        items:
          $ref: '#/definitions/createofferhttp.FlightInput'
        type: array
      status:
        enum:
        - draft
        - ready
        - published
        type: string
      title:
        maxLength: 200
        type: string
    required:
    - status
    - title
    type: object
  createofferhttp.CreateOfferResponse:
    properties:
      id:
        type: integer
      uuid:
        type: string
    type: object
  createofferhttp.FlightInput:
    properties:
      currency:
        example: RUB
        type: string
      manager_comment:
        example: Багаж оплачивается отдельно
        maxLength: 2000
        type: string
      price:
        example: "12345.50"
        type: string
      segments:
        items:
          $ref: '#/definitions/createofferhttp.FlightSegmentInput'
        minItems: 1
        type: array
    required:
    - currency
    - price
    - segments
    type: object
  createofferhttp.FlightSegmentInput:
    properties:
      airline_id:
        description: AirlineID — id авиакомпании из поиска GET /api/v1/airlines; обязателен
          (нет поля, null или 0 — 400 с meta {"AirlineID":"required"}). Перевозчик
          неизвестен — 1 («Неизвестная»). Нет в справочнике или скрытая из поиска
          запись, на которую оффер ещё не ссылался, — 400 «flight segment references
          an unknown airline».
        example: 1
        type: integer
      arrival_airport_icao:
        type: string
      arrival_at:
        type: string
      cabin_class:
        allOf:
        - $ref: '#/definitions/flight.CabinClass'
        description: CabinClass — класс обслуживания сегмента; необязателен (отсутствие
          поля, null и "" — класс неизвестен). Допустимые значения — enum схемы flight.CabinClass
          (справочник классов обслуживания); недопустимое значение — 400 с meta {"CabinClass":"oneof"}.
        example: economy
      departure_airport_icao:
        type: string
      departure_at:
        type: string
      flight_number:
        description: 'FlightNumber — номер рейса сегмента, строка до 10 символов;
          пробелы по краям обрезаются до проверки длины, в остальном хранится как
          передан (формат не проверяется, регистр, пробелы внутри и разделители не
          меняются). Необязателен: отсутствие поля, null, "" и строка из одних пробелов
          — номер неизвестен. Длиннее 10 символов после обрезки — 400 с meta {"FlightNumber":"max"}.'
        example: SU1234
        maxLength: 10
        type: string
    required:
    - airline_id
    - arrival_airport_icao
    - arrival_at
    - departure_airport_icao
    - departure_at
    type: object
  createuserhttp.CreateUserRequest:
    properties:
      agency_id:
        description: |-
          AgencyID links the new user to an existing, active agency.
          Required for every registration (1 user = 1 agency).
        type: integer
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - agency_id
    - email
    - first_name
    - last_name
    - password
    type: object
  createuserhttp.CreateUserResponse:
    properties:
      id:
        type: integer
    type: object
  flight.CabinClass:
    enum:
    - ""
    - economy
    - comfort
    - comfort_plus
    - business
    type: string
    x-enum-varnames:
    - CabinClassUnknown
    - CabinClassEconomy
    - CabinClassComfort
    - CabinClassComfortPlus
    - CabinClassBusiness
  getairlinehttp.GetResponse:
    properties:
      data:
        $ref: '#/definitions/airlinehttp.AirlineResponse'
    type: object
  getmehttp.Agency:
    properties:
      id:
        type: integer
      name:
        type: string
      uuid:
        type: string
    type: object
  getmehttp.GetMeResponse:
    properties:
      agency:
        $ref: '#/definitions/getmehttp.Agency'
      email:
        type: string
      first_name:
        type: string
      last_name:
        type: string
      phone:
        type: string
      rights:
        $ref: '#/definitions/getmehttp.Rights'
      uuid:
        type: string
    type: object
  getmehttp.Rights:
