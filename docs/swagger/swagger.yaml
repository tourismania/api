  /api/v1/currencies:
    get:
      description: 'Returns the system currency list: ISO 4217 code and number of
        decimal places, in directory order.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/listcurrencieshttp.ListCurrenciesResponse'
        "401":
