        example: Аэрофлот
        type: string
    type: object
  getofferhttp.FlightResponse:
    properties:
      arrival_airport_icao:
        type: string
      currency:
        example: RUB
        type: string
      departure_airport_icao:
        type: string
      id:
        type: integer
      layovers:
        items:
          $ref: '#/definitions/getofferhttp.LayoverResponse'
        type: array
      manager_comment:
        description: |-
          ManagerComment — комментарий менеджера к перелёту как есть; поле
          присутствует всегда, "" — комментария нет.
        example: Багаж оплачивается отдельно
        type: string
      price:
        description: |-
          Price — цена перелёта строкой ровно с тем числом знаков после
